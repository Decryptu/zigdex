name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create on the selected branch, e.g. v0.4.0
        required: true
      notes:
        description: Release notes (Markdown)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - run: zig build test

      - name: Build and package
        run: |
          for arch in aarch64 x86_64; do
            zig build -Doptimize=fast -Dtarget=$arch-macos --prefix out/$arch
            name=zigdex-$TAG-$arch-macos
            tar -czf $name.tar.gz -C out/$arch/bin zigdex
            (cd out/$arch/bin && zip -q "$GITHUB_WORKSPACE/$name.zip" zigdex)
          done
          sha256sum *.tar.gz *.zip > checksums.txt
          md5sum *.tar.gz *.zip | sed 's/  / /' > md5sums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          assets=(*.tar.gz *.zip checksums.txt md5sums.txt)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Zigdex $TAG" --notes "$NOTES" "${assets[@]}"
          else
            gh release create "$TAG" --title "Zigdex $TAG" --notes-from-tag "${assets[@]}"
          fi
